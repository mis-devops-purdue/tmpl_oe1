# Teammate Bot for MIS 58710 — OE 1 (Git Workflow Solo): reviews, opens its own PR, causes a conflict
# Runs the checker from the DEFAULT branch, so a pull request can't change what checks it.
name: Teammate Bot
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, review_requested, closed]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: oe1_${{ github.repository }}
  cancel-in-progress: false
jobs:
  bot:
    # The bot's own actions never trigger workflows, but skip bots anyway.
    if: ${{ !endsWith(github.actor, '[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/bot
      - name: Run checker
        run: python3 .github/bot/oe1.py
        env:
          GH_TOKEN: ${{ github.token }}
          STUDENT_LOGIN: ${{ vars.STUDENT_LOGIN }}
